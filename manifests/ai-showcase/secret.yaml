# ============================================
# Secret for AI-Showcase Application
# ============================================
# Stores sensitive configuration like API keys
# and credentials.
#
# WARNING: In production, use external secret management
# tools like HashiCorp Vault, AWS Secrets Manager,
# or Azure Key Vault instead of storing secrets in Git.

apiVersion: v1
kind: Secret
metadata:
  name: ai-showcase-secrets
  namespace: ai-showcase
  labels:
    app: ai-showcase
    component: secrets
    managed-by: argocd
  annotations:
    description: "Secrets for AI-Showcase application"

type: Opaque
stringData:
  # OpenAI API Key for AI-assisted fixes
  # Replace with your actual API key in production
  OPENAI_API_KEY: "sk-demo-key-replace-in-production"
  
  # GitHub token for creating auto-fix PRs
  # Requires: repo, pull_requests, automerge scopes
  GITHUB_TOKEN: "ghp_demo-token-replace-in-production"
  
  # Database connection string (if using external metrics storage)
  DATABASE_URL: "mongodb://default:password@mongodb:27017/ai-showcase"
  
  # Redis connection URL for distributed caching
  REDIS_URL: "redis://:password@redis:6379/0"

---
# ============================================
# Registry Secret for GHCR Authentication
# ============================================
# Used by Kubernetes to pull images from GitHub Container Registry
#
# Create this secret with:
# kubectl create secret docker-registry ghcr-secret \
#   --docker-server=ghcr.io \
#   --docker-username=<github-username> \
#   --docker-password=<github-token> \
#   --docker-email=<email> \
#   -n ai-showcase

apiVersion: v1
kind: Secret
metadata:
  name: ghcr-secret
  namespace: ai-showcase
  labels:
    app: ai-showcase
    component: registry-auth
type: kubernetes.io/dockercfg
data:
  # Create this with kubectl create secret docker-registry
  # This is a placeholder - actual secret will be created separately
  .dockercfg: eyJnaGNyLmlvIjogeyJ1c2VybmFtZSI6ICJkZW1vIiwgImF1dGgiOiAiZEdWemRFQW1kSFIzTG0xeE1pQm5kRzl1YkdGdVoyVSJ9fQ==
