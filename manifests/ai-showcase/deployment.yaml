# ============================================
# Deployment for AI-Showcase Application
# ============================================
# Standard Kubernetes Deployment for the AI-Showcase app
# This deployment is managed by Argo Rollouts for canary deployments
#
# Note: When using Argo Rollouts, this deployment may be replaced
# by a Rollout resource. Keep this for reference and standard use cases.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-showcase-app
  namespace: ai-showcase
  labels:
    app: ai-showcase
    component: app
    managed-by: argocd
  annotations:
    description: "Deployment for AI-Showcase CI/CD demonstration application"
    owner: "devops-team"

spec:
  # Number of replicas
  replicas: 2

  # Revision history limit for rollouts
  revisionHistoryLimit: 10

  # Deployment strategy (replaced by Rollout when using Argo Rollouts)
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  # Selector for pod template
  selector:
    matchLabels:
      app: ai-showcase
      component: app

  # Pod template specification
  template:
    metadata:
      labels:
        app: ai-showcase
        component: app
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"

    spec:
      # Security context for the pod
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault

      # Service account (can be used for RBAC)
      serviceAccountName: ai-showcase

      # Termination grace period for graceful shutdown
      terminationGracePeriodSeconds: 30

      # Init containers (if needed)
      initContainers: []

      # Application container specification
      containers:
      - name: ai-showcase-app
        image: ghcr.io/devopssessionsjvr/agentic-ai-demo/ai-showcase-app:demo-e408ddd
        imagePullPolicy: IfNotPresent

        # Container ports
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP

        # Environment variables from ConfigMap and Secret
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: ai-showcase-config
              key: NODE_ENV

        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: ai-showcase-config
              key: LOG_LEVEL

        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: ai-showcase-secrets
              key: OPENAI_API_KEY

        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: ai-showcase-secrets
              key: GITHUB_TOKEN

        # Kubernetes downward API - pod metadata
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName

        # Resource requests and limits
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi

        # Liveness probe - restart if container is not healthy
        livenessProbe:
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3

        # Readiness probe - remove from load balancer if not ready
        readinessProbe:
          httpGet:
            path: /ready
            port: http
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 2

        # Startup probe - give container time to start
        startupProbe:
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          initialDelaySeconds: 0
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 30

        # Security context for the container
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1001
          capabilities:
            drop:
            - ALL

        # Volume mounts
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /app/.cache

        # Lifecycle hooks
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/sh
              - -c
              - sleep 15  # Give connection draining time

      # Volumes
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 100Mi
      - name: cache
        emptyDir:
          sizeLimit: 50Mi

      # Image pull secrets (if using private registry)
      imagePullSecrets:
      - name: ghcr-secret

      # Affinity rules for pod placement
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - ai-showcase
              topologyKey: kubernetes.io/hostname

      # Tolerations for node taints
      tolerations: []

      # DNS policy
      dnsPolicy: ClusterFirst
