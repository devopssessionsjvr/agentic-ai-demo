<!DOCTYPE html>
<html>
<head>
  <title>🚀 AI CI/CD MTTR Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      padding: 20px;
    }

    h1, h2 { text-align: center; }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-bottom: 25px;
    }

    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
    }

    .value {
      font-size: 22px;
      font-weight: bold;
      color: cyan;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      border: 1px solid #334155;
      padding: 10px;
      text-align: center;
    }

    th { background: #1e293b; }

    canvas {
      background: white;
      border-radius: 10px;
      margin-top: 20px;
      padding: 10px;
    }
  </style>
</head>

<body>

<h1>🚀 AI CI/CD MTTR Dashboard</h1>
<p style="text-align:center;">Namespace: ai-showcase</p>

<!-- ===== Stats ===== -->
<div class="grid">
  <div class="card">
    <div>Total Deployments</div>
    <div class="value">7</div>
  </div>

  <div class="card">
    <div>Success Rate</div>
    <div class="value">71.4%</div>
  </div>

  <div class="card">
    <div>Avg MTTR</div>
    <div class="value">6.8 min</div>
  </div>

  <div class="card">
    <div>AI Fix Usage</div>
    <div class="value">40%</div>
  </div>
</div>

<!-- ===== Charts ===== -->
<h2>📊 MTTR Trend</h2>
<canvas id="mttrChart"></canvas>

<h2>📊 AI Fix vs Manual</h2>
<canvas id="aiChart"></canvas>

<h2>📊 Success vs Failed</h2>
<canvas id="successChart"></canvas>

<!-- ===== Table ===== -->
<h2>📋 Recent Deployments</h2>
<table>
<thead>
<tr>
  <th>Commit</th>
  <th>Status</th>
  <th>MTTR</th>
  <th>AI Fix</th>
  <th>Author</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>

<script>

// ===== SAMPLE DATA =====
const records = [
  {commit:"bbb222c", status:"succeeded", mttr:4.8, ai:true, author:"ai-bot"},
  {commit:"uvw111a", status:"succeeded", mttr:3.5, ai:false, author:"devopssessionsjvr"},
  {commit:"pqr456l", status:"failed", mttr:0, ai:false, author:"devopssessionsjvr"},
  {commit:"xyz789a", status:"succeeded", mttr:10.5, ai:true, author:"ai-bot"},
  {commit:"abc123d", status:"succeeded", mttr:5.2, ai:false, author:"devopssessionsjvr"}
];

// ===== TABLE =====
records.forEach(r => {
  document.getElementById("table").innerHTML += `
    <tr>
      <td>${r.commit}</td>
      <td>${r.status}</td>
      <td>${r.mttr}</td>
      <td>${r.ai}</td>
      <td>${r.author}</td>
    </tr>`;
});

// ===== CHART DATA =====
const labels = records.map(r => r.commit);
const mttrData = records.map(r => r.mttr);

const successCount = records.filter(r => r.status === "succeeded").length;
const failCount = records.length - successCount;

const aiCount = records.filter(r => r.ai).length;
const manualCount = records.length - aiCount;

// ===== MTTR LINE =====
new Chart(document.getElementById("mttrChart"), {
  type: 'line',
  data: {
    labels,
    datasets: [{
      label: 'MTTR (minutes)',
      data: mttrData,
      borderColor: 'cyan',
      tension: 0.3
    }]
  }
});

// ===== AI PIE =====
new Chart(document.getElementById("aiChart"), {
  type: 'pie',
  data: {
    labels: ['AI Fix', 'Manual'],
    datasets: [{
      data: [aiCount, manualCount],
      backgroundColor: ['#22c55e', '#ef4444']
    }]
  }
});

// ===== SUCCESS DOUGHNUT =====
new Chart(document.getElementById("successChart"), {
  type: 'doughnut',
  data: {
    labels: ['Success', 'Failed'],
    datasets: [{
      data: [successCount, failCount],
      backgroundColor: ['#3b82f6', '#f43f5e']
    }]
  }
});

</script>

</body>
</html>
